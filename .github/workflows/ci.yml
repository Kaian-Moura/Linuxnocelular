name: Verificar documentação
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run check:snippets
      - run: npm run check:git-workshop
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build -- --out-dir build-subpath
        env:
          DOCUSAURUS_URL: https://validation.invalid
          DOCUSAURUS_BASE_URL: /guia/
      - run: npm run check:links
        env:
          DOCUSAURUS_BASE_URL: /guia/
          DOCUSAURUS_BUILD_DIR: build-subpath
      - run: npm run test:browser
        env:
          DOCUSAURUS_BASE_URL: /guia/
          DOCUSAURUS_TEST_SUBPATH: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
